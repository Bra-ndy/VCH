{% extends "base.html" %}

{% block title %}Reset Password - {{ app_name or 'VCH' }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-dark">
                <div class="text-center mb-4">
                    <i class="fas fa-lock" style="font-size: 3rem; color: var(--gold);"></i>
                    <h2 class="mt-2">Reset Password</h2>
                    <p class="text-muted-custom">Enter your new password below</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    {{ form.hidden_tag() if form else '' }}
                    
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
                        <small class="text-muted-custom">Must contain at least 8 characters, one letter and one number</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="password_confirm" class="form-control" placeholder="Confirm your new password" required>
                    </div>
                    
                    <button type="submit" class="btn-gold w-100">
                        <i class="fas fa-check"></i> Reset Password
                    </button>
                </form>
                
                <hr class="border-gold my-4">
                
                <div class="text-center">
                    <p class="mb-0">
                        <a href="{{ url_for('auth.login') }}" class="gold">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
