{% extends "base.html" %}

{% block title %}Forgot Password - {{ app_name or 'VCH' }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-dark">
                <div class="text-center mb-4">
                    <i class="fas fa-key" style="font-size: 3rem; color: var(--gold);"></i>
                    <h2 class="mt-2">Forgot Password</h2>
                    <p class="text-muted-custom">Enter your email address and we'll send you a reset link</p>
                </div>
                
                <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                    {{ form.hidden_tag() if form else '' }}
                    
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    
                    <button type="submit" class="btn-gold w-100">
                        <i class="fas fa-paper-plane"></i> Send Reset Link
                    </button>
                </form>
                
                <hr class="border-gold my-4">
                
                <div class="text-center">
                    <p class="mb-0">
                        <a href="{{ url_for('auth.login') }}" class="gold">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
