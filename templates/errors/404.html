{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <i class="fas fa-exclamation-triangle" style="font-size: 5rem; color: var(--gold);"></i>
            <h1 class="display-1 fw-bold mt-4">404</h1>
            <h2 class="mb-4">Page Not Found</h2>
            <p class="text-muted-custom mb-4">The page you are looking for might have been removed or is temporarily unavailable.</p>
            <a href="{{ url_for('index') }}" class="btn-gold">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
