{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <i class="fas fa-bug" style="font-size: 5rem; color: var(--gold);"></i>
            <h1 class="display-1 fw-bold mt-4">500</h1>
            <h2 class="mb-4">Internal Server Error</h2>
            <p class="text-muted-custom mb-4">Something went wrong on our end. Please try again later or contact support if the problem persists.</p>
            <a href="{{ url_for('index') }}" class="btn-gold">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
