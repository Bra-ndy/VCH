services: 
  - type: web 
    name: vch-production 
    env: python 
    region: oregon 
    buildCommand: bash build.sh
    startCommand: gunicorn -c gunicorn.conf.py app:app 
    envVars: 
      - key: FLASK_ENV 
        value: production 
      - key: PYTHON_VERSION 
        value: 3.11.0 
      - key: SECRET_KEY 
        generateValue: true 
      - key: DATABASE_URL 
        value: postgresql://vch_prod_user:password@localhost:5432/vch_production  # Placeholder
      - key: ADMIN_NAME 
        value: WINNY LANGAT 
      - key: ADMIN_MPESA_NUMBER 
        value: 0753796259 
    healthCheckPath: /health 
    autoDeploy: true