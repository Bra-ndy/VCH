services: 
  - type: web 
    name: vch-production 
    env: python 
    region: oregon 
    buildCommand: bash build.sh
    startCommand: gunicorn -c gunicorn.conf.py app:app 
    envVars: 
      - key: FLASK_ENV 
        value: production 
      - key: PYTHON_VERSION 
        value: 3.11.0 
      - key: SECRET_KEY 
        generateValue: true 
      - key: DATABASE_URL 
        fromDatabase: 
          name: vch-production-db 
          property: connectionString 
      - key: ADMIN_NAME 
        value: WINNY LANGAT 
      - key: ADMIN_MPESA_NUMBER 
        value: 0753796259 
    healthCheckPath: /health 
    autoDeploy: true

  - type: postgres
    name: vch-production-db 
    region: oregon 
    database: vch_production 
    user: vch_prod_user 
    plan: free  # ← Change from "pro" to "free"
    diskSizeGB: 1  # ← Free plan uses 1GB